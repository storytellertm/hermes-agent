<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#080d12" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>SPARK</title>
    <!--
      Pre-paint the themed background before the app bundle loads. This must
      remain a synchronous classic script: the first frame is what
      `ready-to-show` waits for, while the module graph applies the full theme
      later. applyTheme() in src/themes/context.tsx keeps its storage keys fresh.
    -->
    <script src="./boot-prepaint.js"></script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
